# Gera um APK de teste do app (Android) a cada mudança no main.
# O APK fica em Releases do GitHub, pronto para baixar no celular.
name: APK Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Gerar o projeto Android
        run: npx expo prebuild -p android --no-install
        env:
          CI: 1

      # Só arm64 (quase todos os celulares atuais) para o build sair mais rápido.
      - name: Compilar o APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Separar o APK
        run: cp android/app/build/outputs/apk/release/app-release.apk bjj-timer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bjj-timer-apk
          path: bjj-timer.apk

      - name: Publicar em Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" bjj-timer.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "APK de teste #${{ github.run_number }}" \
            --notes "Versão de teste do app, gerada a partir do commit ${GITHUB_SHA::7}. Baixe o bjj-timer.apk no celular Android e abra para instalar."
